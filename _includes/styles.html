<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* --- Hashnode-style typography (Inter), layered over Beautiful Jekyll --- */

  /* Use Inter everywhere for a consistent Hashnode feel */
  body,
  .navbar,
  .post-heading .post-title,
  .post-heading .post-subheading,
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Article body: Hashnode reading sizing */
  .blog-post {
    font-size: 1.2rem;       /* ~19px */
    line-height: 1.75;
    font-weight: 400;
    color: #242424;
    letter-spacing: -0.003em;
  }
  .blog-post p,
  .blog-post ul,
  .blog-post ol {
    margin-bottom: 1.3rem;
  }
  .blog-post li { margin-bottom: 0.4rem; }

  /* Headings: bold and tight like Hashnode */
  .blog-post h1,
  .blog-post h2,
  .blog-post h3,
  .blog-post h4 {
    margin-top: 2.5rem;
    margin-bottom: 0.9rem;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #1a1a1a;
  }
  .blog-post h2 { font-size: 1.65rem; }
  .blog-post h3 { font-size: 1.32rem; }
  .blog-post h4 { font-size: 1.12rem; }

  /* Post title / subtitle — centered, Hashnode-style */
  .post-heading {
    text-align: center;
  }
  /* Header heading block: centered and capped to the article content width
     (~730px) so the title shares the same left/right edges as the subtitle and
     body instead of overhanging them. Longer titles wrap to two lines, which is
     fine. Scoped to .intro-header so the article body column is unaffected. */
  .intro-header .row > [class*="col-"] {
    flex: 0 0 100%;
    max-width: 730px;
    margin-left: auto;
    margin-right: auto;
  }
  .intro-header .post-heading h1 {
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #1a1a1a;
    /* Fluid: ~32px on phones, up to ~48px on desktop. Dialled down from the
       original 3.5rem Hashnode match for better balance against the body. */
    font-size: clamp(2rem, 6.5vw, 3rem);
    overflow-wrap: break-word;
  }
  .intro-header .post-heading .post-subheading {
    font-weight: 400;
    color: #6b6f76;
    font-size: 1.3rem;
    line-height: 1.4;
    margin-top: 0.6rem;
    /* Title spans the full-width header; keep the subtitle within the
       article content width and centered so it wraps instead of running
       into one over-long line on wide screens. */
    max-width: 730px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Home / post list — Hashnode-style: smaller, left-aligned, muted */
  /* Widen the listing column so subtitles only wrap when genuinely long
     (scoped to the post list, so the article body column stays narrow). */
  .row > [class*="col-"]:has(> .posts-list) {
    flex: 0 0 100%;
    max-width: 1030px;   /* content ~1000px: the longest one-line subtitle fits; longer ones wrap */
    margin-left: auto;
    margin-right: auto;
  }
  .post-preview {
    text-align: left;
  }
  .post-preview .post-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: -0.01em;
  }
  .post-preview .post-subtitle {
    font-size: 1rem;
    color: #6b6f76;
    margin-top: 0.3rem;
  }
  .post-preview .post-meta {
    font-size: 0.9rem;
    color: #828282;
  }

  /* Code: soft rounded blocks, subtle inline highlight */
  .blog-post pre {
    border-radius: 8px;
    padding: 1rem 1.2rem;
    border: 1px solid #e6e8eb;
    overflow: auto;
    font-size: 0.92rem;
  }
  .blog-post :not(pre) > code {
    color: #242424;
    background: rgba(135, 131, 120, 0.15);
    padding: 0.15em 0.4em;
    border-radius: 5px;
    font-size: 0.9em;
  }

  /* Quotes and images */
  .blog-post blockquote {
    border-left: 4px solid #008AFF;
    background: #f8f9fa;
    padding: 0.7rem 1.1rem;
    color: #4a4a4a;
    border-radius: 0 6px 6px 0;
    font-size: 1.12rem;
  }
  .blog-post img { border-radius: 8px; }

  /* Thin, full-width, airy horizontal rules — Hashnode-style */
  .blog-post hr {
    display: block;
    width: 100%;
    height: 1px;
    border: 0;
    background-color: #e0e0e0;
    opacity: 1;
    margin: 3rem auto;
  }

  /* Post tags — Hashnode-style chips instead of the theme's plain text links.
     Restrained (muted grey, small) so they read as secondary browse-by-topic
     links without competing with the discuss CTA nearby. */
  .blog-tags {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }
  .blog-tags > span {
    color: #6b6f76;
    font-weight: 600;
    margin-right: 0.2rem;
  }
  .blog-tags a {
    display: inline-block;
    background: #f1f3f5;
    color: #4a4a4a;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .blog-tags a:hover {
    background: #e2e5e9;
    color: #1a1a1a;
    text-decoration: none;
  }

  /* /tags index page — the theme renders the tag buttons as loud blue Bootstrap
     buttons; restyle them as the same grey chips used in post footers, and tidy
     the per-tag section headings/entries to match the site's typography. */
  .tag-btn.btn-primary {
    display: inline-block;
    background: #f1f3f5;
    border: none;
    color: #4a4a4a;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.3rem 0.8rem;
    margin: 0 0.4rem 0.5rem 0;
    border-radius: 999px;
    box-shadow: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tag-btn.btn-primary:hover,
  .tag-btn.btn-primary:focus,
  .tag-btn.btn-primary:active {
    background: #e2e5e9;
    color: #1a1a1a;
    box-shadow: none;
  }
  .linked-section {
    margin-top: 2.2rem;
    font-size: 1.4rem;
    font-weight: 700;
    color: #1a1a1a;
  }
  .tag-entry { margin: 0.35rem 0; }
  .tag-entry a {
    color: #008AFF;
    text-decoration: none;
  }
  .tag-entry a:hover { text-decoration: underline; }
  .entry-date {
    color: #828282;
    font-size: 0.9rem;
  }

  /* Home brand header ("The Architect's Ledger") — sized just above the
     post-list item title/subtitle rather than as a large banner. Scoped to the
     home page (the only page with a post list) so the About header is untouched. */
  body:has(.posts-list) .intro-header .page-heading h1 {
    font-size: 1.7rem;          /* list title is 1.5rem; a touch more */
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #1a1a1a;
  }
  body:has(.posts-list) .intro-header .page-subheading {
    font-size: 1.1rem;          /* list subtitle is 1rem; a touch more */
    color: #6b6f76;
  }

  /* Center rendered mermaid diagrams */
  .mermaid {
    display: flex;
    justify-content: center;
    margin: 1.8rem 0;
  }

  /* "Discuss this post" card (rendered from `discuss` frontmatter). A full
     border, not a left accent, so it doesn't read as a blockquote. */
  .discuss-cta {
    margin: 3rem 0 2.5rem;
    padding: 1.4rem 1.5rem;
    border: 1px solid #e3e8ef;
    border-radius: 10px;
    background: #f6f9fc;
    color: #4a4a4a;
  }
  .discuss-cta-title {
    margin: 0 0 0.35rem;
    font-size: 1.2rem;
    font-weight: 700;
    color: #222;
  }
  .discuss-cta-text {
    margin: 0 0 1rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  .discuss-cta-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }
  /* min-height keeps the button a comfortable tap target on phones. Brand
     colors are darkened where needed for 4.5:1 contrast with white text. */
  .discuss-cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 44px;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    background: #0070D1;
    color: #fff !important;
    font-weight: 600;
    text-decoration: none !important;
  }
  .discuss-cta-btn:hover { filter: brightness(0.88); }
  .discuss-cta-btn--linkedin   { background: #0A66C2; }
  .discuss-cta-btn--reddit     { background: #D23A00; }
  .discuss-cta-btn--x          { background: #000; }
  .discuss-cta-btn--hackernews { background: #C65000; }
  .discuss-cta-btn--github     { background: #24292f; }
  .discuss-cta-btn--mastodon   { background: #563ACC; }
  .discuss-cta-note {
    margin: 0.9rem 0 0;
    font-size: 0.85rem;
    color: #7a7a7a;
  }
  /* Phones: full-width buttons, so longer labels like Reddit's fit on one line. */
  @media (max-width: 576px) {
    .discuss-cta { padding: 1.2rem 1rem; }
    .discuss-cta-btn {
      width: 100%;
      justify-content: center;
      padding: 0.55rem 0.8rem;
      font-size: 0.95rem;
    }
  }
</style>
